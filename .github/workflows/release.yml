# Builds the Linux AppImage, the Windows zip and the Unity package, then makes a DRAFT release.
#
# Safety choices (see docs/RELEASING.md for the reasons):
# - Every action is pinned to a full commit hash, not a tag (tags can be moved by an attacker).
# - Only GitHub's own actions are used; the release is created with the preinstalled `gh` tool.
# - No secrets are used at all. The build jobs get a read-only token; only the last job can write.
# - Python packages come from packaging/requirements-build.txt with hashes. (Ubuntu's own system
#   libraries come from apt, signed by Ubuntu, at their current versions.)
# - The release is a draft: nothing is public until you press "Publish" yourself.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual test run (Actions tab > release > Run workflow): builds everything and keeps the files
  # as workflow artifacts for 7 days. It never creates a release.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'  # keep in step with PYTHON_FULL_VERSION in packaging/lock_deps.py
      - run: python tests/test_core.py
      - run: python tests/test_gui_glue.py
      - run: python tests/test_lock_deps.py
      - run: python tests/test_unitypackage.py

  linux:
    needs: test
    # Oldest supported runner = widest glibc compatibility for the AppImage.
    # If GitHub retires it, switch to ubuntu-24.04 and raise LINUX_PLATFORMS in packaging/lock_deps.py to glibc 2.39.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'  # keep in step with PYTHON_FULL_VERSION in packaging/lock_deps.py
      - name: System libraries Qt loads while PyInstaller inspects it
        run: |
          sudo apt-get update
          # Qt 6.5+ needs the xcb libraries below to open windows on X11; PyInstaller copies them into the AppImage.
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - name: Build AppImage
        run: bash packaging/build_appimage.sh
      - name: Check the code inside the finished AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/GlucOSC-x86_64.AppImage --self-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/GlucOSC-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: test
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'  # keep in step with PYTHON_FULL_VERSION in packaging/lock_deps.py
      - name: Build Windows zip
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/GlucOSC-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  unity:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'  # keep in step with PYTHON_FULL_VERSION in packaging/lock_deps.py
      - name: Pack the Unity files
        run: python tools/make_unitypackage.py --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity
          path: |
            dist/GlucOSC-Unity.unitypackage
            dist/GlucOSC-Unity.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [linux, windows, unity]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Optional extra gate: in Settings > Environments > release, add yourself as a required reviewer
    # and this job will wait for you to approve it in the browser.
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build provenance with GitHub's identity (Sigstore)
      attestations: write  # store the provenance so anyone can check it with `gh attestation verify`
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/GlucOSC-x86_64.AppImage
            dist/GlucOSC-windows-x64.zip
            dist/GlucOSC-Unity.unitypackage
            dist/GlucOSC-Unity.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          **Display only.** CGM readings lag; never make treatment decisions from an avatar.

          | File | What it is |
          |---|---|
          | GlucOSC-windows-x64.zip | Bridge app for Windows (unzip, run GlucOSC.exe) |
          | GlucOSC-x86_64.AppImage | Bridge app for Linux |
          | GlucOSC-Unity.unitypackage | Avatar device builder for Unity (or use the .zip) |
          | SHA256SUMS.txt | Checksums |

          ### Check your download
          \`\`\`
          sha256sum -c SHA256SUMS.txt --ignore-missing
          gh attestation verify GlucOSC-windows-x64.zip --repo ${REPO} \\
            --signer-workflow ${REPO}/.github/workflows/release.yml \\
            --source-ref refs/tags/${TAG} --deny-self-hosted-runners
          \`\`\`
          (Use the same command for the other files.)
          EOF
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "GlucOSC $TAG" --notes-file notes.md \
            dist/GlucOSC-x86_64.AppImage dist/GlucOSC-windows-x64.zip \
            dist/GlucOSC-Unity.unitypackage dist/GlucOSC-Unity.zip dist/SHA256SUMS.txt
